<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Initech's calendar audit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@700;800&family=Manrope:wght@500;600;700&display=swap">
<style>
  html, body { margin: 0; width: 1080px; height: 1350px; overflow: hidden; background: #FFFFFF; }

  .callout p { font: 600 26px/1.35 'Manrope', sans-serif; margin: 0; }
  svg { display: block; flex: 1; }
  .foot { display: flex; justify-content: space-between; align-items: flex-end; font: 600 21px/1.3 'Manrope', sans-serif; color: #6B7280; margin-top: 18px; }
  .brand { font: 800 24px/1 'Hanken Grotesk', sans-serif; letter-spacing: .06em; color: #111318; }
</style></head>
