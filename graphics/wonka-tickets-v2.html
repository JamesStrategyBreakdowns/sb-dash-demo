<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Scarcity beats spend</title>

<style>

  svg { display: block; flex: 1; }
  .foot { display: flex; justify-content: space-between; align-items: flex-end; font: 600 21px/1.3 'Manrope', sans-serif; color: #6B7280; margin-top: 18px; }
