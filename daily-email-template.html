<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@700;800&family=Manrope:wght@400;500;600;700&display=swap">
<style>
  body { margin: 0; padding: 0; background: #ffffff; color: #222222; font: 400 16px/1.6 'Manrope', -apple-system, 'Segoe UI', sans-serif; }
  table { border-collapse: collapse; }
  .wrap { width: 100%; background: #F4F1EA; padding: 24px 0; }
  .card { width: 100%; max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 8px; overflow: hidden; }
  .pad { padding: 0 32px; }
  .head { padding: 28px 32px 8px; text-align: center; }
  .head img { width: 190px; height: auto; }
  .kicker { margin: 18px 0 4px; font: 700 12px/1 'Manrope', sans-serif; letter-spacing: .12em; text-transform: uppercase; color: #8F6BF2; }
  h1 { margin: 0 0 16px; font: 800 28px/1.15 'Hanken Grotesk', sans-serif; color: #1A1A1F; }
  h3 { margin: 0; font: 700 18px/1.3 'Hanken Grotesk', sans-serif; }
  p { margin: 0 0 14px; }
  .divider { height: 3px; margin: 22px 32px; border-radius: 2px; background: linear-gradient(90deg, #B19EF8, #FC6932, #FBBF24); }
  ul { margin: 8px 0 0; padding-left: 20px; }
  li p { margin: 0 0 8px; }
  .foot { padding: 20px 32px 30px; text-align: center; font-size: 12px; color: #8a8478; }
</style>
</head>
<body>
<div class="wrap">
<table class="card" role="presentation">
  <tr><td class="head"><img src="brand/wordmark.png" alt="Strategy Breakdowns"><p class="kicker">The Daily</p></td></tr>
  <tr><td class="pad"><h1>Today's chart</h1></td></tr>
  <tr><td class="pad"><p>[INSERT INFOGRAPHIC]</p></td></tr>
  <tr><td class="pad" style="padding-top:16px"><p>[caption line 1]</p><p>[caption line 2]</p></td></tr>
  <tr><td><div class="divider"></div></td></tr>
  <tr><td class="pad"><p>[POLL]</p></td></tr>
  <tr><td><div class="divider"></div></td></tr>
  <tr><td class="pad"><h3>Mini Rabbit Hole</h3></td></tr>
  <tr><td class="pad"><ul><li><p>[link]</p></li></ul></td></tr>
  <tr><td class="foot">You are reading a demo of the Daily. Everything in it is synthetic.<br>Strategy Breakdowns</td></tr>
</table>
</div>
</body>
</html>
